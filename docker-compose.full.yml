version: '3.8'

# ==============================================================================
# ChronoDump Full-Stack Docker Compose (All-in-One Mode)
# Runs both the Ollama LLM server and ChronoDump inside container network.
# ==============================================================================

services:
  ollama:
    image: ollama/ollama:latest
    container_name: chronodump-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  chronodump:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chronodump-bot
    restart: unless-stopped
    depends_on:
      - ollama
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./data:/app/data
      - whisper_models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  ollama_models:
  whisper_models:
