version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: chronodump-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Uncomment deploy section below if GPU acceleration is available on host
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  chronodump:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chronodump-bot
    restart: unless-stopped
    depends_on:
      - ollama
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./data:/app/data

volumes:
  ollama_models:
